
name: Python CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'release/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-validation:
    name: Terzaghi 1D Consolidation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v
